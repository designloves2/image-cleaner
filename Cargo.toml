[package]
name = "image_cleaner"
version = "1.0.0"
edition = "2024"
description = "Image Cleaner - 완전 중복 이미지 제거 · 병합 · 연도별 정리 도구 (native, Rust)"
license = "GPL-3.0-or-later"
repository = "https://github.com/designloves2/image-cleaner"
readme = "README.md"

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
image = "0.25.10"
kamadak-exif = "0.6.2"
open = "5.4.5"
rayon = "1.12.0"
rfd = "0.18.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
walkdir = "2.5.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
